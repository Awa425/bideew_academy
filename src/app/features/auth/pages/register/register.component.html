<div
  class="d-flex align-items-center justify-content-center vh-100 bg-primary bg-gradient"
>
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 450px">
    <div class="card-body">
      <h3 class="text-center text-primary mb-4">Inscription</h3>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <div class="mb-3">
          <label for="name" class="form-label">Nom Compléte</label>
          <input
            formControlName="name"
            type="text"
            id="name"
            class="form-control"
            name="name"
            required
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Adresse e-mail</label>
          <input
          formControlName="email"
            type="email"
            id="email"
            class="form-control"
            name="email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input
          formControlName="password"
            type="password"
            id="password"
            class="form-control"
            name="password"
            required
          />
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label"
            >Confirmer le mot de passe</label
          >
          <input
          formControlName="confirmPassword"
            type="password"
            id="confirmPassword"
            class="form-control"
            name="confirmPassword"
            required
          />
        </div>
        <div>
          <label>Rôle</label>
          <select formControlName="role" formControlName="role" class="form-control">
            <option value="apprenant">Apprenant</option>
            <option value="formateur">Formateur</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          Créer un compte
        </button>
        <p *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</p>
      </form>
      <div class="mt-3 text-center">
        <small
          >Vous avez déjà un compte ?
          <a href="auth/login" class="text-decoration-none">Connectez-vous</a>
        </small>
      </div>
    </div>
  </div>
</div>
