<div class="resources-container">
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-top">
        <button class="btn-back" (click)="goBack()" title="RETOUR">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <div>
          <h1 class="header-title">Ressources d'Apprentissage</h1>
          <p class="header-description">
            Découvrez notre bibliothèque complète de ressources pédagogiques
          </p>
        </div>
      </div>
      
      <!-- Stats -->
      <div class="stats-container">
        <div class="stat-item" *ngFor="let category of categories.slice(1)">
          <div class="stat-number">{{ category.count }}</div>
          <div class="stat-label">{{ category.name }}</div>
        </div>
      </div>
    </div>
  </header>
<!-- Bouton retour -->
  <a [routerLink]="['../../']" class="btn-retour" title="RETOUR">
    <img src="../../../../assets/left-long-solid.svg" alt="Retour" width="30" />
  </a>
  <div class="main-content">
    <!-- Contrôles -->
    <div class="controls-section">
      <!-- Barre de recherche -->
      <div class="search-container">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input
          type="text"
          placeholder="Rechercher des ressources..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
          class="search-input"
        />
      </div>

      <!-- Toggle vue -->
      <div class="view-toggle">
        <button
          (click)="setViewMode('grid')"
          [class.active]="viewMode === 'grid'"
          class="toggle-btn"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          Grille
        </button>
        <button
          (click)="setViewMode('list')"
          [class.active]="viewMode === 'list'"
          class="toggle-btn"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          Liste
        </button>
      </div>
    </div>

    <!-- Filtres par catégorie -->
    <div class="categories-section">
      <button
        *ngFor="let category of categories"
        (click)="selectCategory(category.id)"
        [class.active]="currentCategory === category.id"
        class="category-btn"
      >
        <svg *ngIf="category.icon === 'grid'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <svg *ngIf="category.icon === 'file-text'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <svg *ngIf="category.icon === 'video'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <svg *ngIf="category.icon === 'wrench'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.43 7.43l-2.33 2.33a2 2 0 1 1-2.83-2.83l3.75-3.75a6 6 0 0 1 7.42-7.42z"/>
        </svg>
        {{ category.name }}
        <span class="category-count">{{ category.count }}</span>
      </button>
    </div>
    <!-- Ressources -->
    <div class="resources-section" [class.list-view]="viewMode === 'list'" [class.grid-view]="viewMode === 'grid'">
      <div
        *ngFor="let resource of filteredResources"
        class="resource-card"
        [class.list-item]="viewMode === 'list'"
      >
        <div class="resource-header">
          <div 
            class="resource-icon"
            [style.background-color]="getTypeColor(resource.type)"
          >
            <svg *ngIf="getTypeIcon(resource.type) === 'file-text'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <svg *ngIf="getTypeIcon(resource.type) === 'video'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <svg *ngIf="getTypeIcon(resource.type) === 'wrench'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.43 7.43l-2.33 2.33a2 2 0 1 1-2.83-2.83l3.75-3.75a6 6 0 0 1 7.42-7.42z"/>
            </svg>
          </div>
          <div class="resource-info">
            <h3 class="resource-title">{{ resource.title }}</h3>
            <span class="resource-type">{{ resource.type }}</span>
          </div>
        </div>
        
        <p class="resource-description">{{ resource.description }}</p>

        <div class="resource-actions">
          <button
            (click)="handleDownload(resource)"
            [disabled]="isLoading"
            class="btn-download"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Télécharger
          </button>
          <button
            *ngIf="resource.path"
            (click)="openExternalLink(resource.path!)"
            class="btn-external"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            Ouvrir
          </button>
        </div>
      </div>
    </div>

    <!-- Message aucune ressource -->
    <div *ngIf="filteredResources.length === 0" class="no-resources">
      <div class="no-resources-icon">📚</div>
      <h3>Aucune ressource trouvée</h3>
      <p>Essayez de modifier vos critères de recherche</p>
    </div>
  </div>
</div>
